<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #111; margin: 0; padding: 10px; font-family: sans-serif; }
svg { width: 100%; max-width: 720px; display: block; margin: auto; }
.th { font-size: 11px; font-weight: bold; fill: #eee; }
.ts { font-size: 9.5px; fill: #aaa; }
.box-red    { fill: #2a0808; stroke: #f44; }
.box-coral  { fill: #2a1008; stroke: #f84; }
.box-gray   { fill: #1a1a1a; stroke: #666; }
.box-teal   { fill: #081a1a; stroke: #0af; }
.box-purple { fill: #180820; stroke: #a0f; }
.wire-ac    { stroke: #f44; stroke-width: 1.5; fill: none; }
.wire-12v   { stroke: #fa0; stroke-width: 1.5; fill: none; }
.wire-5v    { stroke: #0af; stroke-width: 1.5; fill: none; }
.wire-sig   { stroke: #0f8; stroke-width: 1.2; fill: none; }
.wire-gnd   { stroke: #555; stroke-width: 1.5; fill: none; }
.wire-dash  { stroke: #666; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
marker path { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" stroke="#888"/></marker>
  <marker id="ar-ac"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" stroke="#f44"/></marker>
  <marker id="ar-12v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" stroke="#fa0"/></marker>
  <marker id="ar-5v"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" stroke="#0af"/></marker>
  <marker id="ar-sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" stroke="#0f8"/></marker>
</defs>
<text class="th" x="12" y="14" fill="#f44">220V MAINS (red)</text>
<text class="th" x="220" y="14" fill="#fa0">12V DC (yellow)</text>
<text class="th" x="430" y="14" fill="#0af">5V / Signal (blue/green)</text>
<rect x="12" y="22" width="130" height="42" rx="6" class="box-red"/>
<text class="th" x="77" y="38" text-anchor="middle">Mains inlet</text>
<text class="ts" x="77" y="52" text-anchor="middle">220V Live + Neutral</text>
<rect x="12" y="90" width="130" height="42" rx="6" class="box-red"/>
<text class="th" x="77" y="106" text-anchor="middle">Fuse 2A 250V</text>
<text class="ts" x="77" y="120" text-anchor="middle">in Live wire only</text>
<rect x="12" y="158" width="130" height="42" rx="6" class="box-red"/>
<text class="th" x="77" y="174" text-anchor="middle">Wago — Live splits</text>
<text class="ts" x="77" y="188" text-anchor="middle">to PSU-L and SSR out-1</text>
<rect x="12" y="226" width="130" height="42" rx="6" class="box-coral"/>
<text class="th" x="77" y="242" text-anchor="middle">SSR-40DA output</text>
<text class="ts" x="77" y="256" text-anchor="middle">terminal 1 + terminal 2</text>
<rect x="12" y="294" width="130" height="42" rx="6" class="box-coral"/>
<text class="th" x="77" y="310" text-anchor="middle">Thermal fuse 133C</text>
<text class="ts" x="77" y="324" text-anchor="middle">clamped on heater body</text>
<rect x="12" y="362" width="130" height="42" rx="6" class="box-coral"/>
<text class="th" x="77" y="378" text-anchor="middle">Heater</text>
<text class="ts" x="77" y="392" text-anchor="middle">wire 2 to Neutral Wago</text>
<line x1="77" y1="64"  x2="77" y2="88"  class="wire-ac" marker-end="url(#ar-ac)"/>
<line x1="77" y1="132" x2="77" y2="156" class="wire-ac" marker-end="url(#ar-ac)"/>
<line x1="77" y1="200" x2="77" y2="224" class="wire-ac" marker-end="url(#ar-ac)"/>
<line x1="77" y1="268" x2="77" y2="292" class="wire-ac" marker-end="url(#ar-ac)"/>
<line x1="77" y1="336" x2="77" y2="360" class="wire-ac" marker-end="url(#ar-ac)"/>
<path d="M77 404 L77 440 L4 440 L4 43 L12 43" class="wire-dash" marker-end="url(#ar)"/>
<text class="ts" x="6" y="454" fill="#666">Neutral return</text>
<path d="M142 179 L186 179 L186 52 L218 52" class="wire-ac" marker-end="url(#ar-ac)"/>
<rect x="218" y="30" width="150" height="42" rx="6" class="box-gray"/>
<text class="th" x="293" y="46" text-anchor="middle">PSU 220V to 12V</text>
<text class="ts" x="293" y="60" text-anchor="middle">Mean Well style 2A</text>
<rect x="218" y="100" width="150" height="42" rx="6" class="box-gray"/>
<text class="th" x="293" y="116" text-anchor="middle">12V rail out</text>
<text class="ts" x="293" y="130" text-anchor="middle">fans+ and buck in</text>
<line x1="293" y1="72"  x2="293" y2="98"  class="wire-12v" marker-end="url(#ar-12v)"/>
<rect x="218" y="168" width="150" height="42" rx="6" class="box-teal"/>
<text class="th" x="293" y="184" text-anchor="middle">Buck 12V to 5V</text>
<text class="ts" x="293" y="198" text-anchor="middle">set 5.0V before use</text>
<line x1="293" y1="142" x2="293" y2="166" class="wire-12v" marker-end="url(#ar-12v)"/>
<path d="M368 121 L408 121 L408 46 L438 46" class="wire-12v" marker-end="url(#ar-12v)"/>
<rect x="438" y="22" width="180" height="42" rx="6" class="box-gray"/>
<text class="th" x="528" y="38" text-anchor="middle">Fans (both parallel)</text>
<text class="ts" x="528" y="54" text-anchor="middle">+ to 12V, minus to MOSFET drain</text>
<rect x="438" y="90" width="270" height="150" rx="6" class="box-teal"/>
<text class="th" x="573" y="110" text-anchor="middle">ESP32 display board</text>
<text class="ts" x="450" y="130" text-anchor="start">PWR from 5V buck</text>
<text class="ts" x="450" y="148" text-anchor="start">IO25 to SSR input +</text>
<text class="ts" x="450" y="166" text-anchor="start">IO32 via 100R to MOSFET gate</text>
<text class="ts" x="450" y="184" text-anchor="start">IO22 SDA to SHT40</text>
<text class="ts" x="450" y="202" text-anchor="start">IO21 SCL to SHT40</text>
<text class="ts" x="450" y="220" text-anchor="start">GND to common ground</text>
<path d="M368 189 L408 189 L408 130 L436 130" class="wire-5v" marker-end="url(#ar-5v)"/>
<rect x="218" y="280" width="150" height="42" rx="6" class="box-coral"/>
<text class="th" x="293" y="296" text-anchor="middle">SSR-40DA input side</text>
<text class="ts" x="293" y="310" text-anchor="middle">in+ IO25  in- GND</text>
<path d="M438 148 L420 148 L420 301 L370 301" class="wire-sig" marker-end="url(#ar-sig)"/>
<line x1="218" y1="301" x2="142" y2="247" class="wire-dash" marker-end="url(#ar)"/>
<text class="ts" x="152" y="290" fill="#666">same SSR</text>
<rect x="218" y="356" width="150" height="60" rx="6" class="box-purple"/>
<text class="th" x="293" y="374" text-anchor="middle">IRLZ44N MOSFET</text>
<text class="ts" x="228" y="391" text-anchor="start">G from 100R from IO32</text>
<text class="ts" x="228" y="407" text-anchor="start">10k Gate to GND</text>
<path d="M438 166 L416 166 L416 386 L370 386" class="wire-sig" marker-end="url(#ar-sig)"/>
<path d="M528 64 L528 440 L293 440 L293 416" class="wire-12v" stroke-dasharray="4 3" marker-end="url(#ar-12v)"/>
<text class="ts" x="530" y="340" fill="#fa0">fan minus</text>
<line x1="293" y1="416" x2="293" y2="480" class="wire-gnd" marker-end="url(#ar)"/>
<rect x="438" y="278" width="270" height="60" rx="6" class="box-teal"/>
<text class="th" x="573" y="298" text-anchor="middle">SHT40 sensor in chamber</text>
<text class="ts" x="448" y="316" text-anchor="start">VIN from ESP32 3V3</text>
<text class="ts" x="448" y="332" text-anchor="start">GND, SDA IO22, SCL IO21</text>
<line x1="573" y1="240" x2="573" y2="276" class="wire-sig" marker-end="url(#ar-sig)"/>
<line x1="10" y1="490" x2="710" y2="490" stroke="#555" stroke-width="2.5"/>
<text class="ts" x="360" y="506" text-anchor="middle" fill="#555">COMMON GND: PSU-, buck-, ESP32 GND, MOSFET source, SSR in-</text>
<line x1="77"  y1="440" x2="77"  y2="490" class="wire-gnd"/>
<line x1="293" y1="480" x2="293" y2="490" class="wire-gnd"/>
<line x1="573" y1="338" x2="573" y2="490" class="wire-gnd" stroke-dasharray="3 3"/>
<rect x="10" y="514" width="700" height="76" rx="6" fill="#1a1a0a" stroke="#555"/>
<text class="ts" x="20" y="530" fill="#f84">Ferrules on ALL mains terminals. Silicone wire throughout hot zone. Sleeve thermal fuse in 200C silicone shrink.</text>
<text class="ts" x="20" y="546" fill="#f84">Set buck to 5.0V BEFORE connecting ESP32. First power-up with heater wire off SSR output.</text>
<text class="ts" x="20" y="562" fill="#aaa">Verify: 12V present, 5V at buck output, ESP32 boots, sensor reads, SSR LED fires on IO25, fans toggle on IO32.</text>
<text class="ts" x="20" y="578" fill="#aaa">Only then connect heater. Supervise first full run. Independent thermometer in chamber.</text>
</svg>
</body>
</html>
